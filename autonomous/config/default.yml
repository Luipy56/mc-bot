# Non-sensitive defaults (connection/secrets → .env only). Override with config/local.yml (optional).

# --- Auth / behaviour (no passwords here) ---
MC_AUTO_AUTH: true
MC_AUTO_REGISTER: false
MC_MAX_LOGIN_ATTEMPTS: 4
MC_MAX_REGISTER_ATTEMPTS: 2
AUTH_CMD_COOLDOWN_MS: 4000
MC_LOGIN_CHAT_DELAY_MS: 600
MC_SPAWN_CHAT_DELAY_MS: 1600
MC_SPAWN_CHAT: "0/"

# --- Task / executor ---
TASK_TIMEOUT_MS: 120000
TASK_FAIL_RETRY_MS: 2500
TASK_MAX_FAILURES: 4
TASK_COOLDOWN_MS: 45000
AGENT_STRUCTURED_LOG: false

# --- Crafting / building / mining ---
CRAFTING_TABLE_FIND_DIST: 48
PLACE_BLOCK_RETRIES: 3
PLACE_RETRY_MS: 500
MINING_GOTO_TIMEOUT_MS: 25000
LOG_VERTICAL_DELTA: 4
LOG_GOAL_RADIUS: 2

# --- Diamond cave ---
DIAMOND_CAVE_SEARCH_DIST: 96
DIAMOND_CAVE_TARGET_Y: -32
DIAMOND_CAVE_NEED_DESCENT_ABOVE_Y: 48

# --- Wooden house ---
HOUSE_PLANKS_NEEDED: 112
HOUSE_PLACE_TIMEOUT_MS: 18000
HOUSE_PLANK_NAME: birch_planks
HOUSE_PLANK_STRICT: true
HOUSE_LOG_TARGET: 30
HOUSE_WIDTH: 6
HOUSE_DEPTH: 6
HOUSE_WALL_HEIGHT: 2

# --- Goto test (first pathfind) ---
# Optional: set GOTO_TEST_X/Y/Z in config/local.yml to anchor pathfind (else spawn + angle or blackboard).
GOTO_TEST_CLEAR_SPAWN: true
GOTO_TEST_AWAY_BLOCKS: 56
GOTO_TEST_TIMEOUT_MS: 120000

# --- Brain / planner / survival ---
STUCK_FAILURES_BEFORE_EXPLORE: 2
IGNORE_RETREAT_TASKS: false
IGNORE_HUNGER_TASKS: false
START_WOOD_TARGET: 3
HUNT_WHEN_NO_FOOD_BELOW: 11
HUNT_STARTER_BELOW: 20
HUNT_TIMEOUT_MS: 30000
HUNT_ATTACK_INTERVAL_MS: 700
HUNT_PICKUP_WAIT_MS: 1800
EAT_MAX_BITES_PER_TASK: 12

# --- RTP / birch ---
BIRCH_HOUSE_USE_RTP: true
RTP_SEARCH_COOLDOWN_MS: 180000

# --- Jarvys voice ---
JARVYS_VOICE: true
JARVYS_VOICE_GAME_CHAT: false
JARVYS_VOICE_MIN_MS: 45000
JARVYS_VOICE_URGENT_MS: 22000
JARVYS_VOICE_STAGNATION_MS: 95000

# --- Roadmap toggles ---
SKIP_WOODEN_HOUSE: false
ENABLE_POTATO_FOOD: false
ENABLE_GEAR_SHORTCUTS: false
ENABLE_POSTGAME: false
ENABLE_EXTRA_PLAYER_SKILLS: false

# --- Human-like pacing ---
HUMAN_LIKE_PLAYER: true
HUMAN_PRE_TASK_MIN_MS: 70
HUMAN_PRE_TASK_MAX_MS: 340
HUMAN_POST_TASK_MIN_MS: 25
HUMAN_POST_TASK_MAX_MS: 220
HUMAN_MINING_JITTER_MS: 95
HUMAN_DEBUG: false
PLAYER_THINK_MIN_MS: 350
PLAYER_THINK_MAX_MS: 1100
HUMAN_ACTION_MIN_MS: 18000
HUMAN_ACTION_MAX_MS: 36000

# --- Movement / world ---
ALLOW_1BY1_TOWERS: false
PROTECTED_ZONE_CLEAR_DIST: 80

# --- End / Nether skills ---
EYE_OF_ENDER_THROWS: 12
BLAZE_ATTACK_TICKS: 8
ENDERMAN_ATTACK_TICKS: 6

# --- Extended / misc skill timeouts ---
EXTENDED_PLAYER_GOTO_MS: 22000
COLLECT_SEEDS_GOTO_MS: 20000
MILK_COW_TIMEOUT_MS: 28000
FARM_WHEAT_GOTO_MS: 22000
SHEAR_SHEEP_TIMEOUT_MS: 32000
PLACE_WATER_GOTO_MS: 22000
WATER_BUCKET_GOTO_MS: 25000
INVENTORY_TRIM_MIN_FREE: 4

# --- Explore ---
EXPLORE_GOTO_TIMEOUT_MS: 18000
EXPLORE_WOOD_GOTO_TIMEOUT_MS: 32000

# --- Chunk strip mission ---
CHUNK_STRIP_TARGET_Y: -58
CHUNK_STRIP_BLOCKS_PER_STEP: 48
CHUNK_STRIP_MIN_FOOD: 24
CHUNK_STRIP_SECURE_EVERY: 4
CHUNK_STRIP_GOTO_MS: 22000
CHUNK_CHEST_GOTO_MS: 28000

# --- Stuck / softlock / mining help ---
PATH_FAIL_STREAK_UNSTUCK: 2
PATH_FAIL_STREAK_EXPLORE: 4
SOFTLOCK_MAX_DIG_MS: 180000
MINING_HELP_CHAT: true
MINING_HELP_CHAT_COOLDOWN_MS: 90000
MINING_HELP_LANG: en

# --- Defaults when .env has no MC_* (dev/tests); production uses .env for real connection ---
MC_PORT: 25565
MC_VERSION: "1.21.11"
MC_AUTH: offline
